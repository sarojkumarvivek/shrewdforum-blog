<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHREWD. Content Manager</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-form {
      text-align: center;
      max-width: 480px;
      padding: 2rem;
    }

    .login-form h1 {
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
      letter-spacing: -1px;
    }

    .login-form h1 span {
      color: #00d2ff;
    }

    .login-form p {
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .login-form input {
      padding: 14px 18px;
      width: 100%;
      font-size: 1rem;
      border: 1px solid #1e293b;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      box-sizing: border-box;
    }

    .login-form input::placeholder {
      color: #64748b;
    }

    .login-form button {
      padding: 14px 32px;
      font-size: 1rem;
      background: #00d2ff;
      color: #0b1120;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      font-weight: 700;
      width: 100%;
    }

    .login-form button:hover {
      background: #00b8e6;
    }

    .login-form a {
      color: #00d2ff;
      font-size: 0.85rem;
    }

    .login-form .logout {
      margin-top: 1rem;
    }

    .login-form .logout button {
      background: transparent;
      color: #ff4444;
      border: 1px solid #ff4444;
      font-size: 0.85rem;
      padding: 8px 16px;
    }
  </style>
</head>

<body>
  <script>
    (function () {
      // Check if user already has a stored token
      var stored = localStorage.getItem('netlify-cms-user');
      if (stored) {
        try {
          var user = JSON.parse(stored);
          if (user && user.token) {
            loadCMS();
            return;
          }
        } catch (e) { }
      }
      showLoginForm();

      function showLoginForm() {
        document.body.innerHTML =
          '<div class="login-form">' +
          '<h1>shrewd<span>.</span></h1>' +
          '<p>Security, Tested.</p>' +
          '<p style="color:#e2e8f0;font-size:0.95rem;">Enter your GitHub Personal Access Token to access the CMS</p>' +
          '<input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" />' +
          '<button onclick="doLogin()">Log In</button>' +
          '<br><br>' +
          '<a href="https://github.com/settings/tokens" target="_blank">Generate token on GitHub &rarr;</a>' +
          '</div>';
      }

      window.doLogin = function () {
        var token = document.getElementById('token').value.trim();
        if (token && token.startsWith('ghp_')) {
          localStorage.setItem('netlify-cms-user', JSON.stringify({
            token: token,
            name: 'Admin',
            login: 'sarojkumarvivek',
            avatar_url: '',
            backendName: 'github'
          }));
          loadCMS();
        } else {
          alert('Please enter a valid GitHub token (starts with ghp_)');
        }
      };

      function loadCMS() {
        document.body.innerHTML = '<div style="text-align:center;padding:4rem;color:#94a3b8;">Loading SHREWD. CMS...</div>';
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
        document.body.appendChild(script);
      }
    })();
  </script>
</body>

</html>
