<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHREWD. Content Manager</title>
</head>

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // If not already logged in, prompt for GitHub PAT directly
    if (!localStorage.getItem('decap-cms-user')) {
      const existingToken = localStorage.getItem('netlify-cms-user') || localStorage.getItem('decap-cms-user');
      if (!existingToken) {
        window.addEventListener('load', () => {
          const btn = document.querySelector('button');
          if (btn) {
            btn.onclick = (e) => {
              const token = prompt("Enter your GitHub Personal Access Token (ghp_...):");
              if (token) {
                localStorage.setItem('decap-cms-user', JSON.stringify({ token: token.trim(), backendName: 'github' }));
                window.location.reload();
              }
            };
          }
        });
      }
    }
  </script>
</body>

</html>
